# The checks that must hold before anything merges.
#
# One job, deliberately. The suite needs a production build and four mock
# services on fixed ports, and splitting that across parallel jobs would
# mean building twice to save nothing: the build is ten seconds and the
# suite is under two minutes.
name: CI

on:
  pull_request:
    branches: [development, staging, main]
  push:
    branches: [development, staging, main]

# A second push to the same branch makes the first run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, build and API suite
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Typecheck
        working-directory: web
        run: npx tsc --noEmit

      # `test-api.sh` runs the production build itself, starts the four
      # mocks, picks a free port and refuses to continue unless the server
      # it reaches is the one it started. It also moves `.env.local` aside
      # first — on a runner there is none, which is the point: the suite
      # must never reach the real Safaricom sandbox.
      - name: API suite
        working-directory: web
        run: bash scripts/test-api.sh

      - name: Build log on failure
        if: failure()
        run: |
          echo "── next build ──"; tail -40 /tmp/pc-next-build.log 2>/dev/null || true
          echo "── next start ──"; tail -40 /tmp/pc-next-test.log 2>/dev/null || true
